name: Build ExchangeCalendarMigrator

on:
  workflow_dispatch:
  push:
    paths:
      - 'export_ical_by_ews/source/**'
      - '.github/workflows/build-exporter.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish export_ical_by_ews/source/ExchangeCalendarMigrator.csproj -c Release -o publish_out

      - name: Copy exe to Publish folder
        shell: bash
        run: cp publish_out/ExchangeCalendarMigrator.exe export_ical_by_ews/Publish/ExchangeCalendarMigrator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeCalendarMigrator
          path: export_ical_by_ews/Publish/ExchangeCalendarMigrator.exe

      - name: Commit rebuilt exe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export_ical_by_ews/Publish/ExchangeCalendarMigrator.exe
          if git diff --cached --quiet; then
            echo "exe unchanged"
          else
            git commit -m "Rebuild ExchangeCalendarMigrator.exe [skip ci]"
            git push
          fi
